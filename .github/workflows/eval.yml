name: retrieval-eval

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ir-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-bge-base-v1

      - name: Cache corpus PDFs
        uses: actions/cache@v4
        with:
          path: data/corpus
          key: corpus-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download corpus
        run: python -m scripts.download_corpus

      - name: Ingest corpus into Qdrant
        env:
          QDRANT_URL: http://localhost:6333
          # No GEMINI key needed: embeddings default to local BGE
        run: python -m scripts.ingest

      - name: Run retrieval eval (dense + hybrid; rerank skipped in CI)
        env:
          QDRANT_URL: http://localhost:6333
          EVAL_SKIP_RERANK: "1"
        run: python -m scripts.eval_retrieval

      - name: Enforce metric floors
        run: python -m scripts.eval_gate --config "hybrid (dense+BM25)" --ndcg 0.80 --recall 0.85 --mrr 0.75

      - name: Upload scorecard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ir-scorecard
          path: eval/results/ir_scorecard.json
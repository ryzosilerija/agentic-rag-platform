# Backend (FastAPI multi-agent platform)
backend:
  image:
    repository: arp-backend
    tag: local
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    PROVIDER: azure
    QDRANT_URL: http://qdrant:6333
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

# Secrets (provider keys). Create via `kubectl create secret` or vault in real
# use — never commit real values. These are placeholders.
secrets:
  AZURE_OPENAI_API_KEY: "REPLACE_ME"
  AZURE_OPENAI_ENDPOINT: "REPLACE_ME"
  NEO4J_PASSWORD: "password123"

qdrant:
  image: qdrant/qdrant:latest
  port: 6333
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

neo4j:
  image: neo4j:5-community
  boltPort: 7687
  httpPort: 7474
  storage: 2Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }

monitoring:
  enabled: true
  prometheus:
    image: prom/prometheus:latest
    port: 9090
  grafana:
    image: grafana/grafana:latest
    port: 3000
    adminPassword: admin
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: arp-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: arp-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
  neo4j:
    image: neo4j:5-community
    container_name: arp-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
volumes:
  neo4j_data:
  qdrant_data:

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: arp-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: arp-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
volumes:
  qdrant_data:
